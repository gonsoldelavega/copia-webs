<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta Clara Canarias</title><style>:root{--b:#eff8f7;--t:#122632;--m:#65727b;--l:#d8e3e6;--a:#4d83a0;--s:#e9f6f4;--w:#f4f0e8}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}.logo,h1,h2,h3,.value{font-family:Georgia,serif;font-weight:400;letter-spacing:-.06em}.login{min-height:100vh;display:grid;place-items:center;padding:34px}.login>div{width:min(520px,100%)}.login h1{font-size:50px;margin:0}.login p{color:var(--m);font-size:20px}.field{display:grid;gap:8px;margin:0 0 16px}label{color:var(--m)}input,select,textarea{width:100%;border:1px solid var(--l);border-radius:17px;padding:15px;font-size:17px;background:#fff}textarea{min-height:95px}.btn{border:0;border-radius:17px;padding:14px 18px;font-weight:700;background:var(--a);color:#fff}.btn2{background:#fff;color:#2f647c;border:1px solid var(--l)}.danger{background:#fff0ef;color:#b54242;border:1px solid #efc9c4}.notice{padding:16px;border-radius:20px;background:var(--s);color:#214b44;margin:0 0 24px;line-height:1.35}.head{display:flex;justify-content:space-between;align-items:center;padding:22px 18px;background:#fff;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:2}.logo{font-size:25px}.logo span{font-family:Arial;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--m)}.hamb{font-size:34px}.wrap{padding:24px 16px 105px}.sub{color:var(--m);font-size:16px}.title{font-size:48px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{background:#fff;border:1px solid var(--l);border-radius:28px;padding:20px;min-height:124px}.card:nth-child(2),.card:nth-child(5){background:var(--s)}.card:nth-child(3){background:var(--w)}.label{text-transform:uppercase;letter-spacing:.12em;color:var(--m);font-size:13px;font-weight:700}.value{font-size:40px;margin-top:18px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);padding:8px;z-index:3}.nav button{border:0;background:#fff;color:var(--m);padding:10px 0;border-radius:16px}.nav .on{background:var(--s);color:#2f647c;font-weight:800}.fab{position:fixed;right:20px;bottom:86px;width:58px;height:58px;border:0;border-radius:21px;background:var(--a);color:#fff;font-size:31px;z-index:4}.modal{border:0;border-radius:30px;width:calc(100vw - 34px);padding:0}.modal::backdrop{background:rgba(20,38,45,.43)}.box{background:#fff;border-radius:30px;padding:24px;max-height:86vh;overflow:auto}.box h2{font-size:38px;margin:0 0 22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:13px}.list{display:grid;gap:12px}.item{background:#fff;border:1px solid var(--l);border-radius:22px;padding:16px}.item b{font-size:18px}.muted{color:var(--m)}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef4f5;color:var(--m);font-size:12px;font-weight:800}.ok{background:#e9f7f0;color:#2d7f64}.bad{background:#fff0ef;color:#b54242}.warn{background:#fff4df;color:#b97816}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.invoice{background:#fff;border:1px solid var(--l);border-radius:28px;padding:24px}.tot{font-family:Georgia,serif;font-size:44px;text-align:right;border-top:1px solid var(--l);padding-top:18px}@media(min-width:760px){#app{display:flex}.head,.nav,.fab{display:none}.side{display:flex!important;width:290px;background:#fff;border-right:1px solid var(--l);padding:28px 20px;min-height:100vh;flex-direction:column;gap:20px}.side .logo{margin-bottom:20px}.side button{border:0;background:#fff;text-align:left;padding:13px;border-radius:18px;color:var(--m)}.side .on{background:var(--s);color:#2f647c;font-weight:800}.wrap{flex:1;padding:34px}.grid{grid-template-columns:repeat(4,1fr)}.row{grid-template-columns:1fr 1fr}.modal{width:min(860px,calc(100vw - 40px))}}</style></head><body><div id="login" class="login"><div><h1>Inicia sesión</h1><p>Accede a tu gestión administrativa.</p><div class="field"><label>Correo</label><input id="mail" type="email" autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password"></div><button id="enterBtn" class="btn" type="button">Entrar</button><p class="notice">App administrativa. No introduzcas datos sensibles.</p></div></div><div id="app" class="hide"><aside class="side hide"><div class="logo">Consulta Clara <span>Canarias</span></div><button data-v="home">Inicio</button><button data-v="clients">Clientes</button><button data-v="sessions">Agenda</button><button data-v="invoices">Facturas</button><button data-v="payments">Cobros</button><button data-v="expenses">Gastos</button><button data-v="quarters">Trimestres</button><button data-v="advisor">Gestoría</button><button data-v="settings">Ajustes</button><p class="notice">Uso administrativo. Revisar cálculos con gestoría.</p></aside><main class="wrap"><header class="head"><div class="logo">Consulta Clara <span>Canarias</span></div><div class="hamb">☰</div></header><div id="screen"></div></main><button id="fab" class="fab">+</button><nav class="nav"><button data-v="home">Inicio</button><button data-v="clients">Clientes</button><button data-v="sessions">Agenda</button><button data-v="invoices">Facturas</button><button data-v="payments">Cobros</button></nav></div><dialog id="modal" class="modal"><div class="box"><div id="mb"></div></div></dialog><script>var S,V='home';function load(){try{S=JSON.parse(localStorage.getItem('ccc')||'{}')}catch(e){S={}}if(!S.clients)S={set:{pref:'PSI-CAN',num:1,igic:7,irpf:0,due:30,pro:'Profesional',city:'Santa Cruz de Tenerife'},clients:[],sessions:[],invoices:[],payments:[],expenses:[]}}function fmt(n){return Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}function gid(p){return p+Date.now()+Math.random().toString(36).slice(2,5)}function save(){localStorage.setItem('ccc',JSON.stringify(S))}function getClient(x){return S.clients.find(function(c){return c.id==x})}function today(){return new Date().toISOString().slice(0,10)}function due(){var d=new Date();d.setDate(d.getDate()+Number(S.set.due||30));return d.toISOString().slice(0,10)}function q(d){return Math.ceil((new Date(d).getMonth()+1)/3)}function yr(d){return new Date(d).getFullYear()}function sum(a,k){return a.reduce(function(s,x){return s+Number(x[k]||0)},0)}function bal(i){return Math.max(0,Number(i.total||0)-sum(S.payments.filter(function(p){return p.inv==i.id}),'amount'))}function badge(t,c){return '<span class="pill '+(c||'')+'">'+t+'</span>'}function enter(){sessionStorage.setItem('ccc_login','1');document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');render()}function nav(){document.querySelectorAll('[data-v]').forEach(function(b){b.classList.toggle('on',b.dataset.v==V);b.onclick=function(){V=b.dataset.v;render()}})}function render(){nav();var r=document.getElementById('screen');if(V=='home')home(r);if(V=='clients')clients(r);if(V=='sessions')sessions(r);if(V=='invoices')invoices(r);if(V=='payments')payments(r);if(V=='expenses')expenses(r);if(V=='quarters')quarters(r);if(V=='advisor')advisor(r);if(V=='settings')settings(r)}function metrics(){var m=new Date().getMonth(),y=new Date().getFullYear(),inv=S.invoices.filter(function(i){return new Date(i.date).getMonth()==m&&yr(i.date)==y&&i.st!='anulada'}),pay=S.payments.filter(function(p){return new Date(p.date).getMonth()==m&&yr(p.date)==y}),exp=S.expenses.filter(function(e){return new Date(e.date).getMonth()==m&&yr(e.date)==y});return{fac:sum(inv,'total'),cob:sum(pay,'amount'),gas:sum(exp,'total'),irpf:sum(inv,'irpf'),pend:S.invoices.reduce(function(a,i){return a+bal(i)},0),ses:S.sessions.filter(function(s){return s.st=='asistida'}).length,sf:S.sessions.filter(function(s){return s.st=='asistida'&&!s.inv}).length}}function card(a,b){return '<div class="card"><div class="label">'+a+'</div><div class="value">'+b+'</div></div>'}function home(r){var m=metrics(),mo=new Date().toLocaleDateString('es-ES',{month:'long',year:'numeric'}).replace(/^./,function(x){return x.toUpperCase()});r.innerHTML='<p class="notice">No introduzcas notas sensibles en campos administrativos. Gestión fiscal orientativa.</p><p class="sub">Resumen del mes en curso</p><h1 class="title">'+mo+'</h1><p class="sub">ⓘ Cálculo orientativo. Revisar con gestoría.</p><section class="grid">'+card('Facturado',fmt(m.fac))+card('Cobrado',fmt(m.cob))+card('Pendiente',fmt(m.pend))+card('Gastos',fmt(m.gas))+card('Beneficio',fmt(m.fac-m.gas))+card('IRPF retenido',fmt(m.irpf))+card('Sesiones realizadas',m.ses)+card('Sin facturar',m.sf)+'</section><div class="item" style="margin-top:18px"><b>Acciones rápidas</b><div class="actions"><button class="btn" onclick="formClient()">Cliente</button><button class="btn" onclick="formSession()">Sesión</button><button class="btn btn2" onclick="formInvoice()">Factura</button><button class="btn btn2" onclick="formExpense()">Gasto</button></div></div>'}function clients(r){r.innerHTML='<h1 class="title">Clientes</h1><button class="btn" onclick="formClient()">+ Cliente</button><div class="list" style="margin-top:16px">'+(!S.clients.length?'<div class="item">Sin clientes.</div>':S.clients.map(function(c){return '<div class="item"><b>'+c.name+' '+(c.sur||'')+'</b><p class="muted">NIF: '+(c.nif||'—')+' · '+(c.type||'particular')+'</p><p>'+fmt(c.price||0)+' · IGIC '+(c.igicReg||'exento')+' · IRPF '+(c.irpf||0)+'%</p><div class="actions"><button class="btn btn2" onclick="formClient(\''+c.id+'\')">Editar</button><button class="btn" onclick="formSession(\''+c.id+'\')">Sesión</button></div></div>'}).join(''))+'</div>'}function sessions(r){r.innerHTML='<h1 class="title">Agenda</h1><button class="btn" onclick="formSession()">+ Sesión</button><div class="list" style="margin-top:16px">'+(!S.sessions.length?'<div class="item">Sin sesiones.</div>':S.sessions.map(function(s){var c=getClient(s.c);return '<div class="item"><b>'+new Date(s.start).toLocaleString('es-ES')+'</b><p>'+(c?c.name:'Cliente')+' · '+fmt(s.price)+' · '+badge(s.st,s.st=='asistida'?'ok':'')+'</p><p class="muted">Facturación: '+(s.inv?badge('facturada','ok'):badge('pendiente','warn'))+'</p><div class="actions"><button class="btn btn2" onclick="formSession(null,\''+s.id+'\')">Editar</button>'+(!s.inv?'<button class="btn" onclick="invoiceSession(\''+s.id+'\')">Facturar</button>':'')+'</div></div>'}).join(''))+'</div>'}function invoices(r){r.innerHTML='<h1 class="title">Facturas</h1><button class="btn" onclick="formInvoice()">+ Factura</button><div class="list" style="margin-top:16px">'+(!S.invoices.length?'<div class="item">Sin facturas.</div>':S.invoices.map(function(i){var c=getClient(i.c);return '<div class="item"><b>'+i.num+'</b><p>'+(c?c.name:'Cliente')+' · '+new Date(i.date).toLocaleDateString('es-ES')+' · '+badge(i.st||'emitida',bal(i)?'warn':'ok')+'</p><p><b>Total '+fmt(i.total)+'</b> · Pendiente '+fmt(bal(i))+'</p><div class="actions"><button class="btn btn2" onclick="seeInvoice(\''+i.id+'\')">Ver</button><button class="btn" onclick="formPay(\''+i.id+'\')">Cobrar</button><button class="btn danger" onclick="voidInv(\''+i.id+'\')">Anular</button></div></div>'}).join(''))+'</div>'}function payments(r){r.innerHTML='<h1 class="title">Cobros</h1><button class="btn" onclick="formPay()">+ Cobro</button><div class="list" style="margin-top:16px">'+(!S.payments.length?'<div class="item">Sin cobros.</div>':S.payments.map(function(p){return '<div class="item"><b>'+fmt(p.amount)+'</b><p>'+new Date(p.date).toLocaleDateString('es-ES')+' · '+p.method+'</p></div>'}).join(''))+'</div>'}function expenses(r){r.innerHTML='<h1 class="title">Gastos</h1><button class="btn" onclick="formExpense()">+ Gasto</button><div class="list" style="margin-top:16px">'+(!S.expenses.length?'<div class="item">Sin gastos.</div>':S.expenses.map(function(e){return '<div class="item"><b>'+e.prov+'</b><p>'+e.cat+' · '+fmt(e.total)+' · '+badge(e.ded||'revisar','warn')+'</p><p class="muted">'+(!e.doc?'Falta justificante':'Justificante marcado')+'</p></div>'}).join(''))+'</div>'}function quarters(r){var y=new Date().getFullYear();r.innerHTML='<h1 class="title">Trimestres</h1><p class="notice">Resumen orientativo. Revisar con gestoría. Modelos posibles: 130, 420, 425, 111, 115.</p><div class="list">'+[1,2,3,4].map(function(n){var inv=S.invoices.filter(function(i){return q(i.date)==n&&yr(i.date)==y}),ex=S.expenses.filter(function(e){return q(e.date)==n&&yr(e.date)==y});return '<div class="item"><b>'+n+'T '+y+'</b><p>Ingresos '+fmt(sum(inv,'total'))+' · Cobrado '+fmt(sum(S.payments.filter(function(p){return q(p.date)==n&&yr(p.date)==y}),'amount'))+'</p><p>Gastos '+fmt(sum(ex,'total'))+' · IRPF '+fmt(sum(inv,'irpf'))+' · IGIC '+fmt(sum(inv,'igic'))+'</p></div>'}).join('')+'</div>'}function advisor(r){var a=[];if(S.sessions.some(function(s){return s.st=='asistida'&&!s.inv}))a.push('Sesiones asistidas sin facturar');if(S.invoices.some(function(i){return bal(i)>0}))a.push('Facturas pendientes de cobro');if(S.expenses.some(function(e){return !e.doc}))a.push('Gastos sin justificante');r.innerHTML='<h1 class="title">Gestoría</h1><p class="notice">Cálculo orientativo. Puede aplicar si se cumplen los requisitos. Revisar con gestoría.</p><div class="list">'+(a.length?a.map(function(x){return '<div class="item">'+badge('Posible incidencia','warn')+' <b>'+x+'</b></div>'}).join(''):'<div class="item">'+badge('Correcto','ok')+' Sin incidencias destacadas.</div>')+'</div>'}function settings(r){var s=S.set;r.innerHTML='<h1 class="title">Ajustes</h1><div class="item"><div class="field"><label>Nombre profesional</label><input id="pro" value="'+s.pro+'"></div><div class="field"><label>Ciudad</label><input id="city" value="'+s.city+'"></div><div class="row"><div class="field"><label>Prefijo</label><input id="pref" value="'+s.pref+'"></div><div class="field"><label>Siguiente Nº</label><input id="num" type="number" value="'+s.num+'"></div></div><div class="row"><div class="field"><label>IGIC general %</label><input id="igic" type="number" value="'+s.igic+'"></div><div class="field"><label>IRPF defecto %</label><input id="irpf" type="number" value="'+s.irpf+'"></div></div><button class="btn" onclick="saveSet()">Guardar</button> <button class="btn danger" onclick="clearAll()">Vaciar datos</button></div>'}function openModal(html){document.getElementById('mb').innerHTML=html;document.getElementById('modal').showModal()}function closeModal(){document.getElementById('modal').close();save();render()}function quick(){openModal('<h2>Nuevo</h2><div class="actions"><button class="btn" onclick="formClient()">Cliente</button><button class="btn" onclick="formSession()">Sesión</button><button class="btn btn2" onclick="formInvoice()">Factura</button><button class="btn btn2" onclick="formExpense()">Gasto</button></div>')}function formClient(cid){var c=cid?getClient(cid):{};openModal('<h2>'+(cid?'Editar':'Nuevo')+' cliente</h2><div class="row"><div class="field"><label>Nombre</label><input id="n" value="'+(c.name||'')+'"></div><div class="field"><label>Apellidos</label><input id="sur" value="'+(c.sur||'')+'"></div></div><div class="row"><div class="field"><label>NIF</label><input id="nif" value="'+(c.nif||'')+'"></div><div class="field"><label>Tipo</label><select id="type"><option>particular</option><option>empresa</option><option>autonomo</option><option>centro</option></select></div></div><div class="row"><div class="field"><label>Email</label><input id="email" value="'+(c.email||'')+'"></div><div class="field"><label>Teléfono</label><input id="phone" value="'+(c.phone||'')+'"></div></div><div class="field"><label>Dirección fiscal</label><input id="addr" value="'+(c.addr||'')+'"></div><div class="row"><div class="field"><label>Precio sesión</label><input id="price" type="number" value="'+(c.price||60)+'"></div><div class="field"><label>IRPF %</label><input id="cirpf" type="number" value="'+(c.irpf||0)+'"></div></div><div class="field"><label>Régimen IGIC</label><select id="igreg"><option value="exento">Exento sanitario</option><option value="general">IGIC general</option><option value="revisar">Revisar</option></select></div><div class="field"><label>Notas administrativas</label><textarea id="notes">'+(c.notes||'')+'</textarea></div><p class="notice">No introducir notas sensibles.</p><button class="btn" onclick="saveClient(\''+(cid||'')+'\')">Guardar</button> <button class="btn btn2" onclick="document.getElementById(\'modal\').close()">Cancelar</button>');if(c.type)document.getElementById('type').value=c.type;if(c.igicReg)document.getElementById('igreg').value=c.igicReg}function saveClient(cid){var c=cid?getClient(cid):{id:gid('c')};c.name=n.value;c.sur=sur.value;c.nif=nif.value;c.type=type.value;c.email=email.value;c.phone=phone.value;c.addr=addr.value;c.price=Number(price.value||0);c.irpf=Number(cirpf.value||0);c.igicReg=igreg.value;c.notes=notes.value;if(!cid)S.clients.push(c);closeModal()}function formSession(cid,sid){if(!S.clients.length){alert('Crea un cliente primero');return}var s=sid?S.sessions.find(function(x){return x.id==sid}):{},dt=s.start||new Date().toISOString().slice(0,16);openModal('<h2>Nueva sesión</h2><div class="field"><label>Cliente</label><select id="sc">'+S.clients.map(function(c){return '<option value="'+c.id+'">'+c.name+' '+(c.sur||'')+'</option>'}).join('')+'</select></div><div class="row"><div class="field"><label>Inicio</label><input id="st" type="datetime-local" value="'+dt+'"></div><div class="field"><label>Precio</label><input id="sprice" type="number" value="'+(s.price||60)+'"></div></div><div class="field"><label>Estado</label><select id="sst"><option value="programada">Programada</option><option value="asistida">Asistida</option><option value="cancelad
