<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Consulta Clara Canarias V4</title><style>:root{--bg:#eef8f6;--paper:#fff;--ink:#122632;--mut:#667780;--line:#d7e5e7;--brand:#4d83a0;--brand2:#2d6379;--soft:#e4f3f0;--sand:#f6f0e5;--green:#2e8065;--red:#b44242;--amber:#b87413}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.serif,h1,h2,h3,.big{font-family:Georgia,serif;font-weight:400;letter-spacing:-.06em}.app{min-height:100vh;padding-bottom:96px}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:18px 16px 14px}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand .name{font-family:Georgia,serif;font-size:25px;letter-spacing:-.06em}.brand .name span{font-family:Arial,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.26em;color:var(--mut)}.topline{font-size:13px;color:var(--mut);margin-top:5px}.screen{padding:20px 15px 110px}.title{font-size:47px;line-height:.96;margin:4px 0 14px}.notice{background:var(--soft);border:1px solid #cfe5e0;color:#244e48;border-radius:22px;padding:14px 15px;margin:0 0 16px;line-height:1.35}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:17px;box-shadow:0 10px 30px rgba(17,38,50,.055)}.card.soft{background:var(--soft)}.card.sand{background:var(--sand)}.label{text-transform:uppercase;letter-spacing:.12em;color:var(--mut);font-size:12px;font-weight:800}.big{font-size:38px;margin-top:14px;line-height:1}.sub{color:var(--mut);font-size:14px;margin-top:8px}.section{margin:22px 0 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.section h2{font-size:33px;margin:0}.section p{margin:5px 0 0;color:var(--mut)}.list{display:grid;gap:12px}.item{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 8px 24px rgba(17,38,50,.04)}.item h3{font-size:26px;margin:0 0 8px}.mut{color:var(--mut)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;background:var(--brand);color:#fff;border-radius:16px;padding:12px 14px;font-weight:800;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;min-height:44px}.btn.alt{background:#fff;color:var(--brand2);border:1px solid var(--line)}.btn.bad{background:#fff0ef;color:var(--red);border:1px solid #efc9c4}.btn.ok{background:#eaf7f1;color:var(--green);border:1px solid #cceadb}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:850;background:#edf4f5;color:var(--mut);margin:2px 4px 2px 0}.pill.ok{background:#e9f7f0;color:var(--green)}.pill.warn{background:#fff4df;color:var(--amber)}.pill.bad{background:#fff0ef;color:var(--red)}.chips{display:flex;gap:8px;overflow:auto;padding:0 0 8px;margin:0 -2px}.chip{border:1px solid var(--line);background:#fff;color:var(--brand2);padding:10px 13px;border-radius:999px;font-weight:800;white-space:nowrap}.chip.on{background:var(--brand);color:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:9;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 7px calc(8px + env(safe-area-inset-bottom))}.bottom button{border:0;background:transparent;color:var(--mut);padding:9px 2px;border-radius:16px;font-size:12px;font-weight:750}.bottom button.on{background:var(--soft);color:var(--brand2)}.fab{position:fixed;right:18px;bottom:86px;z-index:10;width:60px;height:60px;border:0;border-radius:22px;background:var(--brand);color:#fff;font-size:32px;box-shadow:0 18px 36px rgba(77,131,160,.32)}dialog{border:0;border-radius:30px;padding:0;width:calc(100vw - 28px);max-width:780px}dialog::backdrop{background:rgba(18,38,50,.42);backdrop-filter:blur(5px)}.modal{background:#fff;border-radius:30px;padding:24px;max-height:86vh;overflow:auto}.modal h2{font-size:38px;margin:0 0 18px}.field{display:grid;gap:7px;margin:0 0 14px}label{color:var(--mut);font-weight:700}input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;font-size:17px;outline:none}textarea{min-height:96px}.mini{font-size:13px;color:var(--mut)}.invoiceBox{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px}.total{font-family:Georgia,serif;font-size:42px;text-align:right;border-top:1px solid var(--line);padding-top:18px;margin-top:14px}.empty{padding:24px;border:1px dashed #bdd2d6;border-radius:24px;background:#fbfdfd;color:var(--mut);text-align:center}.desk{display:none}@media(min-width:850px){.app{display:grid;grid-template-columns:290px 1fr;padding-bottom:0}.desk{display:flex;position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:28px 20px;flex-direction:column;gap:10px}.desk .logo{font-family:Georgia,serif;font-size:25px;margin-bottom:18px}.desk button{border:0;background:#fff;text-align:left;padding:13px;border-radius:16px;color:var(--mut);font-weight:750}.desk button.on{background:var(--soft);color:var(--brand2)}.top,.bottom,.fab{display:none}.screen{padding:34px;max-width:1180px}.grid{grid-template-columns:repeat(4,1fr)}dialog{width:min(860px,calc(100vw - 40px))}}</style></head><body><div class="app"><aside class="desk"><div class="logo">Consulta Clara<br><span style="font:12px Arial;letter-spacing:.25em;color:#667780">CANARIAS</span></div><button data-go="home">Inicio</button><button data-go="agenda">Agenda</button><button data-go="clients">Clientes</button><button data-go="invoices">Facturas</button><button data-go="alerts">Avisos</button><button data-go="expenses">Gastos</button><button data-go="quarter">Trimestres</button><button data-go="advisor">Gestoría</button><button data-go="settings">Ajustes</button><div class="notice" style="margin-top:auto">Uso administrativo. No introducir notas clínicas sensibles.</div></aside><main><header class="top"><div class="brand"><div class="name">Consulta Clara <span>Canarias</span></div><button class="btn alt" onclick="go('alerts')">Avisos</button></div><div class="topline">Agenda · Facturas · WhatsApp · Gestoría</div></header><section id="screen" class="screen"></section></main><button id="fab" class="fab">+</button><nav class="bottom"><button data-go="home">Inicio</button><button data-go="agenda">Agenda</button><button data-go="clients">Clientes</button><button data-go="invoices">Facturas</button><button data-go="more">Más</button></nav></div><dialog id="dlg"><div class="modal"><div id="modal"></div></div></dialog><script>let S,V='home',F='all';function load(){try{S=JSON.parse(localStorage.ccc||'{}')}catch(e){S={}}if(!S.clients)S={set:{pro:'Profesional',city:'Canarias',pref:'PSI-CAN',num:1,igic:7,due:30,wa:'34'},clients:[],sessions:[],invoices:[],payments:[],expenses:[]};S.set.wa=S.set.wa||'34'}const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),gid=p=>p+Date.now()+Math.random().toString(36).slice(2,6),save=()=>localStorage.ccc=JSON.stringify(S),today=()=>new Date().toISOString().slice(0,10),client=id=>S.clients.find(c=>c.id==id),sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0),badge=(t,c='')=>'<span class="pill '+c+'">'+t+'</span>';function addDays(n){let d=new Date;d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function q(d){return Math.ceil((new Date(d).getMonth()+1)/3)}function bal(i){return Math.max(0,Number(i.total||0)-sum(S.payments.filter(p=>p.inv==i.id),'amount'))}function cleanPhone(c){let p=String(c?.phone||'').replace(/\D/g,'');if(p.length==9)p=S.set.wa+p;return p}function wa(c,msg){let p=cleanPhone(c);if(!p)return alert('Falta teléfono WhatsApp en el cliente');window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank')}function msgCita(s){let c=client(s.c),d=new Date(s.start);return 'Hola '+(c?.name||'')+', te recordamos tu cita el '+d.toLocaleDateString('es-ES')+' a las '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'. Si necesitas cambiarla, avísanos. Gracias.'}function msgInv(i){let c=client(i.c);return 'Hola '+(c?.name||'')+', te envío la factura '+i.num+' por importe de '+fmt(i.total)+'. Gracias.'}function msgPay(i){let c=client(i.c);return 'Hola '+(c?.name||'')+', queda pendiente el pago de la factura '+i.num+' por importe de '+fmt(bal(i))+'. Gracias.'}function nav(){document.querySelectorAll('[data-go]').forEach(b=>{b.classList.toggle('on',b.dataset.go==V);b.onclick=()=>go(b.dataset.go)})}function go(v){V=v;render()}function render(){nav();let r=$('screen');if(V=='home')home(r);if(V=='agenda')agenda(r);if(V=='clients')clients(r);if(V=='invoices')invoices(r);if(V=='alerts')alerts(r);if(V=='expenses')expenses(r);if(V=='quarter')quarter(r);if(V=='advisor')advisor(r);if(V=='settings')settings(r);if(V=='more')more(r)}function metrics(){let m=new Date().getMonth(),y=new Date().getFullYear(),inv=S.invoices.filter(i=>new Date(i.date).getMonth()==m&&new Date(i.date).getFullYear()==y&&i.st!='anulada'),pay=S.payments.filter(p=>new Date(p.date).getMonth()==m&&new Date(p.date).getFullYear()==y),ex=S.expenses.filter(e=>new Date(e.date).getMonth()==m&&new Date(e.date).getFullYear()==y);return{fac:sum(inv,'total'),cob:sum(pay,'amount'),gas:sum(ex,'total'),pend:S.invoices.reduce((a,i)=>a+bal(i),0),citas:todaySessions().length,avisos:dueSessions().length+pendingInv().length}}function stat(a,b,s='',cls=''){return'<div class="card '+cls+'"><div class="label">'+a+'</div><div class="big">'+b+'</div><div class="sub">'+s+'</div></div>'}function home(r){let m=metrics(),mo=new Date().toLocaleDateString('es-ES',{month:'long',year:'numeric'}).replace(/^./,x=>x.toUpperCase());r.innerHTML='<p class="notice">V4 móvil: agenda, facturas, WhatsApp manual, avisos y gestoría conectados.</p><h1 class="title">'+mo+'</h1><div class="grid">'+stat('Facturado',fmt(m.fac),'mes actual')+stat('Cobrado',fmt(m.cob),'registrado','soft')+stat('Pendiente',fmt(m.pend),'por cobrar','sand')+stat('Gastos',fmt(m.gas),'mes actual')+stat('Citas hoy',m.citas,'agenda')+stat('Avisos',m.avisos,'WhatsApp/pagos','soft')+'</div>'+blockNext()+quickPanel()}function blockNext(){let n=S.sessions.filter(s=>new Date(s.start)>new Date()).sort((a,b)=>new Date(a.start)-new Date(b.start))[0];if(!n)return'<div class="section"><h2>Próxima cita</h2></div><div class="empty">No hay citas próximas.</div>';let c=client(n.c);return'<div class="section"><div><h2>Próxima cita</h2><p>Acción rápida desde inicio</p></div></div><div class="item"><h3>'+new Date(n.start).toLocaleString('es-ES')+'</h3><p>'+(c?.name||'Cliente')+' · '+fmt(n.price)+' · '+badge(n.st,n.st=='asistida'?'ok':'warn')+'</p><div class="actions"><button class="btn" onclick="sendSession(\''+n.id+'\')">WhatsApp 24h</button><button class="btn alt" onclick="mark(\''+n.id+'\',\'asistida\')">Asistida</button><button class="btn alt" onclick="invoiceSession(\''+n.id+'\')">Facturar</button></div></div>'}function quickPanel(){return'<div class="section"><h2>Crear rápido</h2></div><div class="grid"><button class="card" onclick="clientForm()"><div class="label">Nuevo</div><div class="big">Cliente</div></button><button class="card soft" onclick="sessionForm()"><div class="label">Nueva</div><div class="big">Cita</div></button><button class="card sand" onclick="invoiceForm()"><div class="label">Nueva</div><div class="big">Factura</div></button><button class="card" onclick="expenseForm()"><div class="label">Nuevo</div><div class="big">Gasto</div></button></div>'}function todaySessions(){return S.sessions.filter(s=>String(s.start).slice(0,10)==today())}function dueSessions(){let now=new Date,max=new Date(Date.now()+48*3600000);return S.sessions.filter(s=>{let d=new Date(s.start);return d>now&&d<max&&!s.rem&&s.st!='cancelada'&&s.st!='no_presentada'})}function pendingInv(){return S.invoices.filter(i=>i.st!='anulada'&&bal(i)>0)}function agenda(r){let list=S.sessions.slice().sort((a,b)=>new Date(a.start)-new Date(b.start));if(F=='today')list=todaySessions();if(F=='todo')list=list.filter(s=>s.st=='asistida'&&!s.inv);if(F=='next')list=list.filter(s=>new Date(s.start)>new Date());r.innerHTML='<h1 class="title">Agenda</h1><div class="chips"><button class="chip '+(F=='all'?'on':'')+'" onclick="F=\'all\';render()">Todas</button><button class="chip '+(F=='today'?'on':'')+'" onclick="F=\'today\';render()">Hoy</button><button class="chip '+(F=='next'?'on':'')+'" onclick="F=\'next\';render()">Próximas</button><button class="chip '+(F=='todo'?'on':'')+'" onclick="F=\'todo\';render()">Sin facturar</button></div><button class="btn" onclick="sessionForm()">+ Nueva cita</button><div class="list" style="margin-top:14px">'+(!list.length?'<div class="empty">No hay citas en este filtro.</div>':list.map(sessionCard).join(''))+'</div>'}function sessionCard(s){let c=client(s.c),d=new Date(s.start);return'<div class="item"><h3>'+d.toLocaleDateString('es-ES',{weekday:'short',day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'</h3><p><b>'+(c?.name||'Cliente')+'</b> · '+fmt(s.price)+'</p><p>'+badge(s.st,s.st=='asistida'?'ok':s.st=='no_presentada'?'bad':'warn')+(s.inv?badge('facturada','ok'):badge('pendiente factura','warn'))+(s.rem?badge('recordado','ok'):badge('sin WhatsApp','warn'))+'</p><div class="actions"><button class="btn" onclick="sendSession(\''+s.id+'\')">WhatsApp 24h</button><button class="btn alt" onclick="mark(\''+s.id+'\',\'asistida\')">Asistida</button>'+(!s.inv?'<button class="btn alt" onclick="invoiceSession(\''+s.id+'\')">Facturar</button>':'')+'<button class="btn bad" onclick="mark(\''+s.id+'\',\'no_presentada\')">No vino</button></div></div>'}function clients(r){r.innerHTML='<h1 class="title">Clientes</h1><button class="btn" onclick="clientForm()">+ Cliente</button><div class="list" style="margin-top:14px">'+(!S.clients.length?'<div class="empty">Sin clientes.</div>':S.clients.map(c=>'<div class="item"><h3>'+c.name+' '+(c.sur||'')+'</h3><p class="mut">'+(c.phone||'Sin teléfono')+' · '+(c.nif||'Sin NIF')+'</p><p>'+badge(c.type||'particular')+badge((c.igicReg||'exento'))+badge('IRPF '+(c.irpf||0)+'%')+'</p><div class="actions"><button class="btn alt" onclick="clientForm(\''+c.id+'\')">Editar</button><button class="btn" onclick="sessionForm(\''+c.id+'\')">Cita</button><button class="btn alt" onclick="wa(client(\''+c.id+'\'),\'Hola '+c.name+', te escribimos desde la consulta.\')">WhatsApp</button></div></div>').join(''))+'</div>'}function invoices(r){r.innerHTML='<h1 class="title">Facturas</h1><button class="btn" onclick="invoiceForm()">+ Factura</button><div class="list" style="margin-top:14px">'+(!S.invoices.length?'<div class="empty">Sin facturas.</div>':S.invoices.map(i=>{let c=client(i.c);return'<div class="item"><h3>'+i.num+'</h3><p>'+(c?.name||'Cliente')+' · '+fmt(i.total)+' · pendiente '+fmt(bal(i))+'</p><p>'+badge(i.st||'emitida',bal(i)>0?'warn':'ok')+(i.sent?badge('WhatsApp enviado','ok'):badge('sin enviar','warn'))+'</p><div class="actions"><button class="btn alt" onclick="seeInvoice(\''+i.id+'\')">Ver/PDF</button><button class="btn" onclick="sendInvoice(\''+i.id+'\')">WhatsApp</button><button class="btn alt" onclick="payForm(\''+i.id+'\')">Cobrar</button><button class="btn bad" onclick="voidInv(\''+i.id+'\')">Anular</button></div></div>'}).join(''))+'</div>'}function alerts(r){let rs=dueSessions(),pi=pendingInv();r.innerHTML='<h1 class="title">Avisos</h1><p class="notice">WhatsApp manual: la app prepara el mensaje y tú confirmas el envío.</p><div class="section"><h2>Citas próximas</h2></div><div class="list">'+(!rs.length?'<div class="empty">No hay citas que recordar.</div>':rs.map(s=>'<div class="item"><h3>'+new Date(s.start).toLocaleString('es-ES')+'</h3><p>'+(client(s.c)?.name||'Cliente')+'</p><button class="btn" onclick="sendSession(\''+s.id+'\')">Enviar recordatorio</button></div>').join(''))+'</div><div class="section"><h2>Pagos pendientes</h2></div><div class="list">'+(!pi.length?'<div class="empty">No hay pagos pendientes.</div>':pi.map(i=>'<div class="item"><h3>'+i.num+'</h3><p>Pendiente '+fmt(bal(i))+'</p><button class="btn" onclick="sendPay(\''+i.id+'\')">Recordar pago</button></div>').join(''))+'</div>'}function expenses(r){r.innerHTML='<h1 class="title">Gastos</h1><button class="btn" onclick="expenseForm()">+ Gasto</button><div class="list" style="margin-top:14px">'+(!S.expenses.length?'<div class="empty">Sin gastos.</div>':S.expenses.map(e=>'<div class="item"><h3>'+e.prov+'</h3><p>'+e.cat+' · '+fmt(e.total)+'</p><p>'+badge(e.ded||'revisar','warn')+(e.doc?badge('justificante','ok'):badge('sin justificante','bad'))+'</p></div>').join(''))+'</div>'}function quarter(r){let y=new Date().getFullYear();r.innerHTML='<h1 class="title">Trimestres</h1><p class="notice">Resumen orientativo para gestoría. Modelos posibles: 130, 420, 425, 111, 115.</p><div class="list">'+[1,2,3,4].map(n=>{let inv=S.invoices.filter(i=>q(i.date)==n&&new Date(i.date).getFullYear()==y&&i.st!='anulada'),ex=S.expenses.filter(e=>q(e.date)==n&&new Date(e.date).getFullYear()==y);return'<div class="item"><h3>'+n+'T '+y+'</h3><p>Ingresos '+fmt(sum(inv,'total'))+' · cobrado '+fmt(sum(S.payments.filter(p=>q(p.date)==n),'amount'))+'</p><p>Gastos '+fmt(sum(ex,'total'))+' · IRPF '+fmt(sum(inv,'irpf'))+' · IGIC '+fmt(sum(inv,'igic'))+'</p></div>'}).join('')+'</div>'}function advisor(r){let a=[];if(S.sessions.some(s=>s.st=='asistida'&&!s.inv))a.push('Sesiones asistidas sin facturar');if(pendingInv().length)a.push('Facturas pendientes de cobro');if(S.expenses.some(e=>!e.doc))a.push('Gastos sin justificante');r.innerHTML='<h1 class="title">Gestoría</h1><p class="notice">Asistente orientativo: revisa incidencias y prepara trimestre. No sustituye a una gestoría.</p><div class="list">'+(a.length?a.map(x=>'<div class="item">'+badge('Posible incidencia','warn')+' <b>'+x+'</b><p class="mut">Revisar con gestoría.</p></div>').join(''):'<div class="item">'+badge('Correcto','ok')+' Sin incidencias destacadas.</div>')+'</div><div class="item" style="margin-top:14px"><h3>Checklist trimestral</h3><p>☐ Facturas emitidas revisadas</p><p>☐ Cobros pendientes revisados</p><p>☐ Gastos con justificante</p><p>☐ IGIC/IRPF revisado</p><div class="actions"><button class="btn alt" onclick="exportData()">Exportar JSON</button></div></div>'}function more(r){r.innerHTML='<h1 class="title">Más</h1><div class="list"><button class="btn alt" onclick="go(\'expenses\')">Gastos</button><button class="btn alt" onclick="go(\'quarter\')">Trimestres</button><button class="btn alt" onclick="go(\'advisor\')">Gestoría</button><button class="btn alt" onclick="go(\'settings\')">Ajustes</button></div>'}function settings(r){let s=S.set;r.innerHTML='<h1 class="title">Ajustes</h1><div class="item"><div class="field"><label>Nombre profesional</label><input id="pro" value="'+s.pro+'"></div><div class="field"><label>Ciudad</label><input id="city" value="'+s.city+'"></div><div class="row"><div class="field"><label>Prefijo factura</label><input id="pref" value="'+s.pref+'"></div><div class="field"><label>Siguiente Nº</label><input id="num" type="number" value="'+s.num+'"></div></div><div class="row"><div class="field"><label>IGIC general %</label><input id="igic" type="number" value="'+s.igic+'"></div><div class="field"><label>Vencimiento días</label><input id="due" type="number" value="'+s.due+'"></div></div><div class="field"><label>Prefijo WhatsApp país</label><input id="wa" value="'+s.wa+'"></div><div class="actions"><button class="btn" onclick="saveSet()">Guardar</button><button class="btn alt" onclick="seed()">Demo</button><button clas
