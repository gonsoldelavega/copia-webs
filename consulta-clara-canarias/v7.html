<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Consulta Clara Canarias V7</title><style>:root{--bg:#eef8f6;--paper:#fff;--ink:#122632;--mut:#667780;--line:#d7e5e7;--brand:#4d83a0;--brand2:#2d6379;--soft:#e5f4f1;--sand:#f6efe4;--green:#2e8065;--red:#b44242;--amber:#b87413;--shadow:0 14px 40px rgba(17,38,50,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.serif,h1,h2,h3,.big,.time{font-family:Georgia,serif;font-weight:400;letter-spacing:-.06em}.app{min-height:100vh;padding-bottom:108px}.top{position:sticky;top:0;z-index:7;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:17px 16px 13px}.brand{display:flex;justify-content:space-between;align-items:center}.name{font-family:Georgia,serif;font-size:25px;letter-spacing:-.06em}.name span{font-family:Arial;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--mut)}.todayLine{margin-top:6px;color:var(--mut);font-size:13px}.screen{padding:18px 15px 118px}.title{font-size:47px;line-height:.95;margin:2px 0 14px}.notice{background:var(--soft);border:1px solid #cfe5e0;color:#244e48;border-radius:22px;padding:13px 14px;margin:0 0 14px;line-height:1.35}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.item{background:#fff;border:1px solid var(--line);border-radius:26px;padding:16px;box-shadow:var(--shadow)}.soft{background:var(--soft)}.sand{background:var(--sand)}.label{text-transform:uppercase;letter-spacing:.12em;color:var(--mut);font-size:11px;font-weight:850}.big{font-size:37px;margin-top:11px;line-height:1}.sub,.mut{color:var(--mut)}.section{margin:22px 0 10px}.section h2{font-size:32px;margin:0}.chips{display:flex;gap:8px;overflow:auto;margin:0 -15px 12px;padding:0 15px 8px}.chip{border:1px solid var(--line);background:#fff;color:var(--brand2);padding:10px 13px;border-radius:999px;font-size:13px;font-weight:850;white-space:nowrap}.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}.list{display:grid;gap:11px}.item h3{font-size:26px;margin:0 0 7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:850;background:#edf4f5;color:var(--mut);margin:2px 4px 2px 0}.ok{background:#e9f7f0;color:var(--green)}.warn{background:#fff4df;color:var(--amber)}.badPill{background:#fff0ef;color:var(--red)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:0;background:var(--brand);color:#fff;border-radius:16px;padding:12px 14px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:43px}.btn.alt{background:#fff;color:var(--brand2);border:1px solid var(--line)}.btn.bad{background:#fff0ef;color:var(--red);border:1px solid #efc9c4}.actionBtn{border:1px solid var(--line);background:#fff;color:var(--brand2);border-radius:999px;padding:8px 10px;font-size:11px;font-weight:850;min-height:34px}.actionBtn.main{background:var(--brand);color:#fff;border-color:var(--brand)}.actionBtn.bad{background:#fff0ef;color:var(--red);border-color:#efc9c4}.agendaHero{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-bottom:14px}.heroCard{border-radius:28px;padding:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.heroCard.main{background:linear-gradient(145deg,#fff,#e6f4f1)}.time{font-size:42px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.98);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:8px 8px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -12px 32px rgba(17,38,50,.08)}.bottom button{border:0;background:transparent;color:var(--mut);border-radius:18px;padding:8px 2px 7px;display:grid;gap:3px;place-items:center;font-size:10.5px;font-weight:800}.bottom .ico{font-size:19px}.bottom button.on{background:var(--soft);color:var(--brand2)}.fab{position:fixed;right:18px;bottom:93px;z-index:11;width:58px;height:58px;border:0;border-radius:22px;background:var(--brand);color:#fff;font-size:30px;box-shadow:0 18px 36px rgba(77,131,160,.34)}dialog{border:0;border-radius:30px;padding:0;width:calc(100vw - 28px);max-width:760px}dialog::backdrop{background:rgba(18,38,50,.42);backdrop-filter:blur(5px)}.modal{background:#fff;border-radius:30px;padding:23px;max-height:86vh;overflow:auto}.modal h2{font-size:38px;margin:0 0 18px}.field{display:grid;gap:7px;margin:0 0 14px}label{color:var(--mut);font-weight:750}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:17px;padding:14px;background:#fff;font-size:17px;outline:none}textarea{min-height:94px}.sheetOverlay{position:fixed;inset:0;background:rgba(18,38,50,.28);z-index:20;display:none;align-items:flex-end}.sheetOverlay.open{display:flex}.sheet{width:100%;background:#fff;border-radius:30px 30px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(17,38,50,.22)}.sheet h2{font-size:34px;margin:0 0 12px}.sheetGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheetBtn{border:1px solid var(--line);background:#fff;border-radius:24px;padding:16px;text-align:left}.sheetBtn b{font-family:Georgia,serif;font-size:25px;font-weight:400}.sheetBtn span{display:block;color:var(--mut);font-size:12px;margin-top:3px}.empty{padding:24px;border:1px dashed #bdd2d6;border-radius:24px;background:#fbfdfd;color:var(--mut);text-align:center}.total{font-family:Georgia,serif;font-size:42px;text-align:right;border-top:1px solid var(--line);padding-top:16px}.desk{display:none}@media(min-width:860px){.app{display:grid;grid-template-columns:290px 1fr;padding-bottom:0}.desk{display:flex;position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:28px 20px;flex-direction:column;gap:10px}.desk .logo{font-family:Georgia,serif;font-size:25px;margin-bottom:18px}.desk button{border:0;background:#fff;text-align:left;padding:13px;border-radius:16px;color:var(--mut);font-weight:750}.desk button.on{background:var(--soft);color:var(--brand2)}.top,.bottom,.fab{display:none}.screen{padding:34px;max-width:1180px}.grid{grid-template-columns:repeat(4,1fr)}dialog{width:min(860px,calc(100vw - 40px))}}</style></head><body><div class="app"><aside class="desk"><div class="logo">Consulta Clara<br><span style="font:12px Arial;letter-spacing:.25em;color:#667780">CANARIAS</span></div><button data-go="agenda">Agenda</button><button data-go="home">Inicio</button><button data-go="clients">Clientes</button><button data-go="invoices">Facturas</button><button data-go="alerts">Avisos</button><button data-go="expenses">Gastos</button><button data-go="quarter">Trimestres</button><button data-go="advisor">Gestoría</button><button data-go="settings">Ajustes</button></aside><main><header class="top"><div class="brand"><div class="name">Consulta Clara <span>Canarias</span></div><button class="btn alt" onclick="go('alerts')">Avisos</button></div><div class="todayLine" id="todayLine"></div></header><section id="screen" class="screen"></section></main><button id="fab" class="fab">+</button><nav class="bottom"><button data-go="agenda"><span class="ico">📅</span><span>Agenda</span></button><button data-go="home"><span class="ico">⌂</span><span>Inicio</span></button><button data-go="invoices"><span class="ico">◫</span><span>Facturas</span></button><button data-go="alerts"><span class="ico">⚑</span><span>Avisos</span></button><button data-go="more"><span class="ico">•••</span><span>Más</span></button></nav></div><div id="sheetOverlay" class="sheetOverlay"><div class="sheet"><h2>Crear rápido</h2><div class="sheetGrid"><button class="sheetBtn" onclick="closeSheet();sessionForm()"><b>Cita</b><span>Agenda y factura automática</span></button><button class="sheetBtn" onclick="closeSheet();clientForm()"><b>Cliente</b><span>Datos fiscales</span></button><button class="sheetBtn" onclick="closeSheet();invoiceForm()"><b>Factura</b><span>Manual</span></button><button class="sheetBtn" onclick="closeSheet();expenseForm()"><b>Gasto</b><span>Justificante</span></button></div></div></div><dialog id="dlg"><div class="modal"><div id="modal"></div></div></dialog><script>let S,V='agenda',F='today';function load(){try{S=JSON.parse(localStorage.ccc||'{}')}catch(e){S={}}if(!S.clients)S={set:{pro:'Profesional',fiscal:'',nif:'',addr:'',email:'',phone:'',col:'',iban:'',pay:'Pago por Bizum o transferencia.',foot:'Cálculo orientativo. Revisar con gestoría.',city:'Canarias',pref:'PSI-CAN',num:1,igic:7,due:30,wa:'34'},clients:[],sessions:[],invoices:[],payments:[],expenses:[]};let d={fiscal:'',nif:'',addr:'',email:'',phone:'',col:'',iban:'',pay:'Pago por Bizum o transferencia.',foot:'Cálculo orientativo. Revisar con gestoría.',wa:'34'};S.set=Object.assign(d,S.set||{})}const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),gid=p=>p+Date.now()+Math.random().toString(36).slice(2,6),save=()=>localStorage.ccc=JSON.stringify(S),today=()=>new Date().toISOString().slice(0,10),client=id=>S.clients.find(c=>c.id==id),sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0),badge=(t,c='')=>'<span class="pill '+c+'">'+t+'</span>';function addDays(n){let d=new Date;d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function q(d){return Math.ceil((new Date(d).getMonth()+1)/3)}function bal(i){return Math.max(0,Number(i.total||0)-sum(S.payments.filter(p=>p.inv==i.id),'amount'))}function cleanPhone(c){let p=String(c?.phone||'').replace(/\D/g,'');if(p.length==9)p=S.set.wa+p;return p}function wa(c,msg){let p=cleanPhone(c);if(!p)return alert('Falta teléfono WhatsApp en el cliente');window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank')}function msgCita(s){let c=client(s.c),d=new Date(s.start);return 'Hola '+(c?.name||'')+', te recordamos tu cita el '+d.toLocaleDateString('es-ES')+' a las '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'. Si necesitas cambiarla, avísanos. Gracias.'}function msgInv(i){let c=client(i.c);return 'Hola '+(c?.name||'')+', te envío la factura '+i.num+' por importe de '+fmt(i.total)+'. Gracias.'}function msgPay(i){let c=client(i.c);return 'Hola '+(c?.name||'')+', queda pendiente el pago de la factura '+i.num+' por importe de '+fmt(bal(i))+'. Gracias.'}function nav(){document.querySelectorAll('[data-go]').forEach(b=>{b.classList.toggle('on',b.dataset.go==V);b.onclick=()=>go(b.dataset.go)})}function go(v){V=v;render()}function render(){nav();$('todayLine').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});let r=$('screen');if(V=='agenda')agenda(r);if(V=='home')home(r);if(V=='clients')clients(r);if(V=='invoices')invoices(r);if(V=='alerts')alerts(r);if(V=='expenses')expenses(r);if(V=='quarter')quarter(r);if(V=='advisor')advisor(r);if(V=='settings')settings(r);if(V=='more')more(r)}function todaySessions(){return S.sessions.filter(s=>String(s.start).slice(0,10)==today())}function nextSessions(){return S.sessions.filter(s=>new Date(s.start)>new Date()).sort((a,b)=>new Date(a.start)-new Date(b.start))}function dueSessions(){let now=new Date,max=new Date(Date.now()+48*3600000);return S.sessions.filter(s=>{let d=new Date(s.start);return d>now&&d<max&&!s.rem&&s.st!='cancelada'&&s.st!='no_presentada'})}function pendingInv(){return S.invoices.filter(i=>i.st!='anulada'&&bal(i)>0)}function metrics(){let m=new Date().getMonth(),y=new Date().getFullYear(),inv=S.invoices.filter(i=>new Date(i.date).getMonth()==m&&new Date(i.date).getFullYear()==y&&i.st!='anulada'),pay=S.payments.filter(p=>new Date(p.date).getMonth()==m&&new Date(p.date).getFullYear()==y),ex=S.expenses.filter(e=>new Date(e.date).getMonth()==m&&new Date(e.date).getFullYear()==y);return{fac:sum(inv,'total'),cob:sum(pay,'amount'),gas:sum(ex,'total'),pend:S.invoices.reduce((a,i)=>a+bal(i),0),today:todaySessions().length,alerts:dueSessions().length+pendingInv().length}}function stat(a,b,s='',cls=''){return'<div class="card '+cls+'"><div class="label">'+a+'</div><div class="big">'+b+'</div><div class="sub">'+s+'</div></div>'}function groupTitle(txt){return'<div class="section"><h2>'+txt+'</h2></div>'}function agenda(r){let list=S.sessions.slice().sort((a,b)=>new Date(a.start)-new Date(b.start));if(F=='today')list=todaySessions();if(F=='next')list=nextSessions();if(F=='todo')list=list.filter(s=>['asistida','finalizada'].includes(s.st)&&!s.inv&&!s.noBill);if(F=='alerts')list=dueSessions();let m=metrics();let morning=list.filter(s=>new Date(s.start).getHours()<14),afternoon=list.filter(s=>new Date(s.start).getHours()>=14);r.innerHTML='<h1 class="title">Agenda</h1><div class="agendaHero"><div class="heroCard main"><div class="label">Hoy</div><div class="time">'+m.today+'</div><div class="sub">citas programadas</div></div><div class="heroCard"><div class="label">Avisos</div><div class="time">'+m.alerts+'</div><div class="sub">WhatsApp / pagos</div></div></div><div class="chips"><button class="chip '+(F=='today'?'on':'')+'" onclick="F=\'today\';render()">Hoy</button><button class="chip '+(F=='next'?'on':'')+'" onclick="F=\'next\';render()">Próximas</button><button class="chip '+(F=='alerts'?'on':'')+'" onclick="F=\'alerts\';render()">A recordar</button><button class="chip '+(F=='todo'?'on':'')+'" onclick="F=\'todo\';render()">Sin facturar</button><button class="chip '+(F=='all'?'on':'')+'" onclick="F=\'all\';render()">Todas</button></div><button class="btn" onclick="sessionForm()">+ Nueva cita</button><div class="list" style="margin-top:14px">'+(!list.length?'<div class="empty">No hay citas en este filtro.</div>':(morning.length?groupTitle('Mañana')+morning.map(sessionCard).join(''):'')+(afternoon.length?groupTitle('Tarde')+afternoon.map(sessionCard).join(''):''))+'</div>'}function sessionCard(s){let c=client(s.c),d=new Date(s.start),hour=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),day=d.toLocaleDateString('es-ES',{weekday:'short',day:'2-digit',month:'short'});return'<div class="item"><h3>'+hour+' · '+day+'</h3><p><b>'+(c?.name||'Cliente')+'</b> · '+fmt(s.price)+'</p><p>'+badge(s.st,s.st=='asistida'||s.st=='finalizada'?'ok':s.st=='no_presentada'?'badPill':'warn')+(s.inv?badge('facturada','ok'):(s.noBill?badge('no facturable','badPill'):badge('sin factura','warn')))+(s.rem?badge('recordado','ok'):badge('sin aviso','warn'))+'</p><div class="actions"><button class="actionBtn main" onclick="sendSession(\''+s.id+'\')">WhatsApp 24h</button><button class="actionBtn" onclick="mark(\''+s.id+'\',\'asistida\')">Asistida</button><button class="actionBtn" onclick="mark(\''+s.id+'\',\'finalizada\')">Finalizada</button><button class="actionBtn" onclick="sessionForm(null,\''+s.id+'\')">Reprogramar</button>'+(!s.inv&&!s.noBill?'<button class="actionBtn" onclick="invoiceSession(\''+s.id+'\')">Facturar</button>':'')+'<button class="actionBtn bad" onclick="mark(\''+s.id+'\',\'no_presentada\')">No vino</button></div></div>'}function home(r){let m=metrics(),mo=new Date().toLocaleDateString('es-ES',{month:'long',year:'numeric'}).replace(/^./,x=>x.toUpperCase());r.innerHTML='<p class="notice">Al marcar una cita como asistida o finalizada, se genera factura automáticamente con el precio de la cita.</p><h1 class="title">'+mo+'</h1><div class="grid">'+stat('Facturado',fmt(m.fac),'mes actual')+stat('Cobrado',fmt(m.cob),'registrado','soft')+stat('Pendiente',fmt(m.pend),'por cobrar','sand')+stat('Gastos',fmt(m.gas),'mes actual')+stat('Citas hoy',m.today,'agenda')+stat('Avisos',m.alerts,'WhatsApp/pagos','soft')+'</div>'}function clients(r){r.innerHTML='<h1 class="title">Clientes</h1><button class="btn" onclick="clientForm()">+ Cliente</button><div class="list" style="margin-top:14px">'+(!S.clients.length?'<div class="empty">Sin clientes.</div>':S.clients.map(c=>'<div class="item"><h3>'+c.name+' '+(c.sur||'')+'</h3><p class="mut">'+(c.phone||'Sin teléfono')+' · '+(c.nif||'Sin NIF')+'</p><p>'+badge(c.type||'particular')+badge((c.igicReg||'exento'))+badge('IRPF '+(c.irpf||0)+'%')+'</p><div class="actions"><button class="actionBtn" onclick="clientForm(\''+c.id+'\')">Editar</button><button class="actionBtn main" onclick="sessionForm(\''+c.id+'\')">Cita</button><button class="actionBtn" onclick="wa(client(\''+c.id+'\'),\'Hola '+c.name+', te escribimos desde la consulta.\')">WhatsApp</button></div></div>').join(''))+'</div>'}function invoices(r){r.innerHTML='<h1 class="title">Facturas</h1><button class="btn" onclick="invoiceForm()">+ Factura</button><div class="list" style="margin-top:14px">'+(!S.invoices.length?'<div class="empty">Sin facturas.</div>':S.invoices.map(i=>{let c=client(i.c);return'<div class="item"><h3>'+i.num+'</h3><p>'+(c?.name||'Cliente')+' · '+fmt(i.total)+' · pendiente '+fmt(bal(i))+'</p><p>'+badge(i.st||'emitida',bal(i)>0?'warn':'ok')+(i.sent?badge('WhatsApp enviado','ok'):badge('sin enviar','warn'))+'</p><div class="actions"><button class="actionBtn" onclick="seeInvoice(\''+i.id+'\')">Ver/PDF</button><button class="actionBtn main" onclick="sendInvoice(\''+i.id+'\')">WhatsApp</button><button class="actionBtn" onclick="payForm(\''+i.id+'\')">Cobrar</button><button class="actionBtn bad" onclick="voidInv(\''+i.id+'\')">Anular</button></div></div>'}).join(''))+'</div>'}function alerts(r){let rs=dueSessions(),pi=pendingInv();r.innerHTML='<h1 class="title">Avisos</h1><p class="notice">Cola manual: prepara WhatsApp, tú confirmas el envío.</p>'+groupTitle('Citas próximas')+'<div class="list">'+(!rs.length?'<div class="empty">No hay citas que recordar.</div>':rs.map(s=>'<div class="item"><h3>'+new Date(s.start).toLocaleString('es-ES')+'</h3><p>'+(client(s.c)?.name||'Cliente')+'</p><button class="btn" onclick="sendSession(\''+s.id+'\')">Enviar recordatorio</button></div>').join(''))+'</div>'+groupTitle('Pagos pendientes')+'<div class="list">'+(!pi.length?'<div class="empty">No hay pagos pendientes.</div>':pi.map(i=>'<div class="item"><h3>'+i.num+'</h3><p>Pendiente '+fmt(bal(i))+'</p><button class="btn" onclick="sendPay(\''+i.id+'\')">Recordar pago</button></div>').join(''))+'</div>'}function expenses(r){r.innerHTML='<h1 class="title">Gastos</h1><button class="btn" onclick="expenseForm()">+ Gasto</button><div class="list" style="margin-top:14px">'+(!S.expenses.length?'<div class="empty">Sin gastos.</div>':S.expenses.map(e=>'<div class="item"><h3>'+e.prov+'</h3><p>'+e.cat+' · '+fmt(e.total)+'</p><p>'+badge(e.ded||'revisar','warn')+(e.doc?badge('justificante','ok'):badge('sin justificante','badPill'))+'</p></div>').join(''))+'</div>'}function quarter(r){let y=new Date().getFullYear();r.innerHTML='<h1 class="title">Trimestres</h1><p class="notice">Resumen orientativo para gestoría. Modelos posibles: 130, 420, 425, 111, 115.</p><div class="list">'+[1,2,3,4].map(n=>{let inv=S.invoices.filter(i=>q(i.date)==n&&new Date(i.date).getFullYear()==y&&i.st!='anulada'),ex=S.expenses.filter(e=>q(e.date)==n&&new Date(e.date).getFullYear()==y);return'<div class="item"><h3>'+n+'T '+y+'</h3><p>Ingresos '+fmt(sum(inv,'total'))+' · cobrado '+fmt(sum(S.payments.filter(p=>q(p.date)==n),'amount'))+'</p><p>Gastos '+fmt(sum(ex,'total'))+' · IRPF '+fmt(sum(inv,'irpf'))+' · IGIC '+fmt(sum(inv,'igic'))+'</p></div>'}).join('')+'</div>'}function advisor(r){let a=[];if(S.sessions.some(s=>['asistida','finalizada'].includes(s.st)&&!s.inv&&!s.noBill))a.push('Sesiones asistidas/finalizadas sin facturar');if(pendingInv().length)a.push('Facturas pendientes de cobro');if(S.expenses.some(e=>!e.doc))a.push('Gastos sin justificante');r.innerHTML='<h1 class="title">Gestoría</h1><p class="notice">Asistente orientativo: revisa incidencias y prepara trimestre.</p><div class="list">'+(a.length?a.map(x=>'<div class="item">'+badge('Posible incidencia','warn')+' <b>'+x+'</b><p class="mut">Revisar con gestoría.</p></div>').join(''):'<div class="item">'+badge('Correcto','ok')+' Sin incidencias destacadas.</div>')+'</div><div class="item" style="margin-top:14px"><h3>Checklist trimestral</h3><p>☐ Facturas emitidas revisadas</p><p>☐ Cobros pendientes revisados</p><p>☐ Gastos con justificante</p><p>☐ IGIC/IRPF revisado</p><div class="actions"><button class="actionBtn" onclick="exportData()">Exportar JSON</button></div></div>'}function more(r){r.innerHTML='<h1 class="title">Más</h1><div class="list"><button class="btn alt" onclick="go(\'clients\')">Clientes</button><button class="btn alt" onclick="go(\'expenses\')">Gastos</button><button class="btn alt" onclick="go(\'quarter\')">Trimestres</button><button class="btn alt" onclick="go(\'advisor\')">Gestoría</button><button class="btn alt" onclick="go(\'settings\')">Ajustes</button></div>'}function settings(r){let s=S.set;r.innerHTML='<h1 class="title">Ajustes</h1><div class="item"><h3>Datos de factura</h3><div class="field"><label>Nombre comercial / profesional</label><input id="pro" value="'+s.pro+'"></div><div class="field"><label>Nombre fiscal</label><input id="fiscal" value="'+s.fiscal+'"></div><div class="row"><div class="field"><label>NIF/CIF</label><input id="snif" value="'+s.nif+'"></div><div class="field"><label>Nº colegiada</label><input id="col" value="'+s.col+'"></div></div><div class="field"><label>Dirección fiscal</label><input id="addr" value="'+s.addr+'"></div><div class="row"><div class="field"><label>Email</label><input id="semail" value="'+s.email+'"></div><div class="field"><label>Teléfono</label><input id="sphone" value="'+s.phone+'"></div></div><div class="field"><label>IBAN / forma de pago</label><input id="iban" value="'+s.iban+'"></div><div class="field"><label>Texto de pago</label><textarea id="pay">'+s.pay+'</textarea></div><div class="field"><label>Pie legal factura</label><textarea id="foot">'+s.foot+'</textarea></div></div><div class="item" style="margin-t label>Estado</label><select id="sst"><option value="programada">Programada</option><option value="asistida">Asistida</option><option value="finalizada">Finalizada</option><option value="cancelada">Cancelada</option><option value="no_presentada">No presentada</option></select></div></div><div class="field"><label>Notas administrativas</label><textarea id="snotes">'+(s.notes||'')+'</textarea></div><p class="notice">Solo se permiten minutos 00, 15, 30 o 45. Si guardas como asistida/finalizada, se factura automáticamente.</p><button class="btn" onclick="saveSession(\''+(id||'')+'\')">Guardar</button>');sc.value=cid||s.c||S.clients[0].id;smin.value=mm;sst.value=s.st||'programada';if(!id)syncPrice()}function syncPrice(){let c=client(sc.value);if(c&&sprice&&!sprice.dataset.touched){sprice.value=c.price||60}}function saveSession(id){let s=id?S.sessions.find(x=>x.id==id):{id:gid('s')};let start=sdate.value+'T'+shour.value+':'+smin.value;Object.assign(s,{c:sc.value,start,price:Number(sprice.value||0),st:sst.value,notes:snotes.value,inv:s.inv||'',rem:s.rem||false,noBill:s.noBill||false});if(!id)S.sessions.push(s);if(['asistida','finalizada'].includes(s.st)&&!s.inv&&!s.noBill){saveInvoice(s,true);return}closeM()}function calc(base,reg,ir){let ig=reg=='general'?base*Number(S.set.igic)/100:0,ret=base*Number(ir||0)/100;return{igic:ig,irpf:ret,total:base+ig-ret}}function invoiceForm(){if(!S.clients.length)return alert('Crea un cliente primero');openM('<h2>Nueva factura</h2><div class="field"><label>Cliente</label><select id="ic">'+S.clients.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('')+'</select></div><div class="field"><label>Concepto</label><input id="concept" value="Sesión profesional"></div><div class="row"><div class="field"><label>Cantidad</label><input id="qty" type="number" value="1"></div><div class="field"><label>Precio</label><input id="unit" type="number" value="60"></div></div><button class="btn" onclick="saveInvoice()">Emitir</button>')}function save invoices.find(x=>x.id==id);wa(client(i.c),msgInv(i));i.sent=true;save();render()}function sendPay(id){let i=S.invoices.find(x=>x.id==id);wa(client(i.c),msgPay(i));i.payrem=true;save();render()}function mark(id,st){let s=S.sessions.find(x=>x.id==id);s.st=st;if(['asistida','finalizada'].includes(st)&&!s.inv&&!s.noBill){saveInvoice(s,true);return}save();render()}function voidInv(id){let i=S.invoices.find(x=>x.id==id);if(confirm('¿Anular factura?')){i.st='anulada';save();render()}}function saveSet(){Object.assign(S.set,{pro:pro.value,fiscal:fiscal.value,nif:snif.value,addr:addr.value,email:semail.value,phone:sphone.value,col:col.value,iban:iban.value,pay:pay.value,foot:foot.value,pref:pref.value,num:Number(num.value||1),igic:Number(igic.value||7),due:Number(due.value||30),wa:wa.value});save();render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='consulta-clara-canarias.json';a.click()}function clearAll(){if(confirm('Vaciar datos locales')){localStorage.removeItem('ccc');location.reload()}}function seed(){if(S.clients.length)return;S.clients.push({id:gid('c'),name:'Pep',sur:'J',nif:'00000000A',phone:'612345678',type:'particular',price:60,irpf:0,igicReg:'exento'});S.sessions.push({id:gid('s'),c:S.clients[0].id,start:new Date(Date.now()+26*3600000).toISOString().slice(0,16),price:60,st:'programada',inv:'',rem:false,noBill:false});save();render()}function openSheet(){$('sheetOverlay').classList.add('open')}function closeSheet(){$('sheetOverlay').classList.remove('open')}load();$('fab').onclick=openSheet;$('sheetOverlay').addEventListener('click',e=>{if(e.target.id=='sheetOverlay')closeSheet()});$('dlg').addEventListener('click',e=>{if(e.target.id=='dlg')$('dlg').close()});if(location.hash=='#demo')seed();render();</script></body></html>
