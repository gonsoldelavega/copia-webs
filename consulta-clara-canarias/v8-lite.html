<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta Clara V8 Lite</title><style>body{margin:0;background:#eef8f6;color:#122632;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;background:white;border-bottom:1px solid #d7e5e7;padding:18px;z-index:3}.brand,h1,h2,h3,.num{font-family:Georgia,serif;font-weight:400;letter-spacing:-.06em}.brand{font-size:26px}.brand span{font:11px Arial;letter-spacing:.25em;color:#667780}.screen{padding:18px 15px 110px}.title{font-size:48px;margin:0 0 14px}.card,.item{background:white;border:1px solid #d7e5e7;border-radius:26px;padding:16px;margin-bottom:12px;box-shadow:0 12px 34px rgba(17,38,50,.06)}.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{text-transform:uppercase;letter-spacing:.12em;color:#667780;font-size:11px;font-weight:800}.num{font-size:40px;margin-top:8px}.btn{border:0;background:#4d83a0;color:white;border-radius:16px;padding:12px 14px;font-weight:800}.btn.alt{background:white;color:#2d6379;border:1px solid #d7e5e7}.btn.bad{background:#fff0ef;color:#b44242;border:1px solid #efc9c4}.actions{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #d7e5e7;background:white;color:#2d6379;border-radius:999px;padding:8px 10px;font-size:11px;font-weight:850}.chip.main{background:#4d83a0;color:white}.pill{display:inline-block;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:850;background:#fff4df;color:#b87413}.pill.ok{background:#e9f7f0;color:#2e8065}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #d7e5e7;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;z-index:4}.bottom button{border:0;background:white;color:#667780;padding:10px 2px;border-radius:16px;font-size:12px;font-weight:800}.bottom .on{background:#e5f4f1;color:#2d6379}.fab{position:fixed;right:18px;bottom:84px;width:58px;height:58px;border:0;border-radius:22px;background:#4d83a0;color:white;font-size:30px;z-index:5}dialog{border:0;border-radius:30px;padding:0;width:calc(100vw - 28px)}dialog::backdrop{background:rgba(18,38,50,.42)}.modal{background:white;border-radius:30px;padding:23px}.field{display:grid;gap:7px;margin-bottom:14px}input,select{width:100%;box-sizing:border-box;border:1px solid #d7e5e7;border-radius:17px;padding:14px;font-size:17px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{background:#e5f4f1;border-radius:20px;padding:13px;margin-bottom:14px;color:#244e48}.success{background:#e9f7f0;border:1px solid #cceadb;border-radius:24px;padding:16px;margin-bottom:14px}.total{font-family:Georgia,serif;font-size:42px;text-align:right;border-top:1px solid #d7e5e7;padding-top:16px}.sheet{position:fixed;inset:0;background:rgba(18,38,50,.28);display:none;align-items:flex-end;z-index:10}.sheet.open{display:flex}.sheet>div{background:white;width:100%;border-radius:30px 30px 0 0;padding:18px}.sheetGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheetBtn{border:1px solid #d7e5e7;background:white;border-radius:24px;padding:16px;text-align:left}.sheetBtn b{font:25px Georgia}</style></head><body><header class="top"><div class="brand">Consulta Clara <span>CANARIAS</span></div></header><main id="screen" class="screen"></main><button id="fab" class="fab">+</button><nav class="bottom"><button data-v="agenda">Agenda</button><button data-v="clients">Clientes</button><button data-v="invoices">Facturas</button><button data-v="settings">Ajustes</button></nav><div id="sheet" class="sheet"><div><h2>Crear rápido</h2><div class="sheetGrid"><button class="sheetBtn" onclick="closeSheet();sessionForm()"><b>Cita</b><span>Factura automática</span></button><button class="sheetBtn" onclick="closeSheet();clientForm()"><b>Cliente</b><span>Precio y teléfono</span></button></div></div></div><dialog id="dlg"><div class="modal" id="modal"></div></dialog><script>let S,V='agenda';function load(){try{S=JSON.parse(localStorage.ccv8||'{}')}catch(e){S={}}if(!S.clients)S={set:{pro:'Profesional',pref:'PSI-CAN',num:1,igic:7},clients:[],sessions:[],invoices:[],payments:[]}}const $=x=>document.getElementById(x),save=()=>localStorage.ccv8=JSON.stringify(S),fmt=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),id=p=>p+Date.now().toString(36),client=i=>S.clients.find(c=>c.id==i),today=()=>new Date().toISOString().slice(0,10),sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0);function bal(i){return Math.max(0,i.total-sum(S.payments.filter(p=>p.inv==i.id),'amount'))}function nav(){document.querySelectorAll('[data-v]').forEach(b=>{b.classList.toggle('on',b.dataset.v==V);b.onclick=()=>{V=b.dataset.v;render()}})}function render(){nav();({agenda,clients,invoices,settings}[V]($('screen')))}function agenda(r){let t=S.sessions.filter(s=>s.start.slice(0,10)==today()).length;r.innerHTML='<h1 class="title">Agenda</h1><div class="hero"><div class="card"><div class="label">Hoy</div><div class="num">'+t+'</div></div><div class="card"><div class="label">Facturas</div><div class="num">'+S.invoices.length+'</div></div></div><button class="btn" onclick="sessionForm()">+ Nueva cita</button>'+S.sessions.map(s=>{let c=client(s.c),d=new Date(s.start);return '<div class="item"><h3>'+d.toLocaleDateString('es-ES')+' · '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'</h3><p><b>'+(c?c.name:'Cliente')+'</b> · '+fmt(s.price)+'</p><p><span class="pill '+(s.inv?'ok':'')+'">'+(s.inv?'facturada':'sin factura')+'</span> <span class="pill">'+s.st+'</span></p><div class="actions"><button class="chip main" onclick="mark(\''+s.id+'\',\'asistida\')">Asistida</button><button class="chip" onclick="mark(\''+s.id+'\',\'finalizada\')">Finalizada</button><button class="chip" onclick="sessionForm(\''+s.id+'\')">Reprogramar</button></div></div>'}).join('')}function clients(r){r.innerHTML='<h1 class="title">Clientes</h1><button class="btn" onclick="clientForm()">+ Cliente</button>'+S.clients.map(c=>'<div class="item"><h3>'+c.name+'</h3><p>'+fmt(c.price)+' · '+(c.phone||'sin teléfono')+'</p><div class="actions"><button class="chip" onclick="clientForm(\''+c.id+'\')">Editar</button><button class="chip main" onclick="sessionForm(null,\''+c.id+'\')">Cita</button></div></div>').join('')}function invoices(r){r.innerHTML='<h1 class="title">Facturas</h1>'+S.invoices.map(i=>'<div class="item"><h3>'+i.num+'</h3><p>'+fmt(i.total)+' · pendiente '+fmt(bal(i))+'</p><div class="actions"><button class="chip" onclick="seeInv(\''+i.id+'\')">Ver</button><button class="chip main" onclick="sendInv(\''+i.id+'\')">WhatsApp</button><button class="chip" onclick="payForm(\''+i.id+'\')">Cobrar</button></div></div>').join('')}function settings(r){r.innerHTML='<h1 class="title">Ajustes</h1><div class="item"><div class="field"><label>Nombre profesional</label><input id="pro" value="'+S.set.pro+'"></div><div class="field"><label>Prefijo factura</label><input id="pref" value="'+S.set.pref+'"></div><div class="row"><div class="field"><label>Siguiente Nº</label><input id="num" type="number" value="'+S.set.num+'"></div><div class="field"><label>IGIC %</label><input id="igic" type="number" value="'+S.set.igic+'"></div></div><button class="btn" onclick="saveSet()">Guardar</button><button class="btn alt" onclick="seed()">Demo</button></div>'}function saveSet(){S.set.pro=pro.value;S.set.pref=pref.value;S.set.num=Number(num.value);S.set.igic=Number(igic.value);save();render()}function openM(h){$('modal').innerHTML=h;$('dlg').showModal()}function closeM(){$('dlg').close();save();render()}function clientForm(cid){let c=cid?client(cid):{};openM('<h2>Cliente</h2><div class="field"><label>Nombre</label><input id="cn" value="'+(c.name||'')+'"></div><div class="field"><label>Teléfono</label><input id="cp" value="'+(c.phone||'')+'"></div><div class="field"><label>Precio sesión</label><input id="cprice" type="number" value="'+(c.price||60)+'"></div><button class="btn" onclick="saveClient(\''+(cid||'')+'\')">Guardar</button>')}function saveClient(cid){let c=cid?client(cid):{id:id('c')};c.name=cn.value;c.phone=cp.value;c.price=Number(cprice.value);if(!cid)S.clients.push(c);closeM()}function hours(sel){let s='';for(let h=7;h<=22;h++){let v=String(h).padStart(2,'0');s+='<option '+(v==sel?'selected':'')+'>'+v+'</option>'}return s}function sessionForm(sid,cid){if(!S.clients.length)return alert('Crea un cliente primero');let s=sid?S.sessions.find(x=>x.id==sid):{},d=s.start?new Date(s.start):new Date(),date=s.start?s.start.slice(0,10):today(),hh=String(d.getHours()).padStart(2,'0'),mm=['00','15','30','45'].includes(String(d.getMinutes()).padStart(2,'0'))?String(d.getMinutes()).padStart(2,'0'):'00';openM('<h2>Cita</h2><div class="field"><label>Cliente</label><select id="sc" onchange="syncP()">'+S.clients.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('')+'</select></div><div class="field"><label>Fecha</label><input id="sd" type="date" value="'+date+'"></div><div class="row"><div class="field"><label>Hora</label><select id="sh">'+hours(hh)+'</select></div><div class="field"><label>Minutos</label><select id="sm"><option>00</option><option>15</option><option>30</option><option>45</option></select></div></div><div class="field"><label>Precio</label><input id="sp" type="number" value="'+(s.price||60)+'"></div><div class="field"><label>Estado</label><select id="sst"><option>programada</option><option>asistida</option><option>finalizada</option><option>cancelada</option></select></div><p class="notice">Si guardas como asistida/finalizada, se factura automáticamente.</p><button class="btn" onclick="saveSession(\''+(sid||'')+'\')">Guardar</button>');sc.value=cid||s.c||S.clients[0].id;sm.value=mm;sst.value=s.st||'programada';if(!sid)syncP()}function syncP(){let c=client(sc.value);if(c)sp.value=c.price||60}function saveSession(sid){let s=sid?S.sessions.find(x=>x.id==sid):{id:id('s')};s.c=sc.value;s.start=sd.value+'T'+sh.value+':'+sm.value;s.price=Number(sp.value);s.st=sst.value;s.inv=s.inv||'';if(!sid)S.sessions.push(s);if(['asistida','finalizada'].includes(s.st)&&!s.inv){let inv=makeInv(s);save();created(inv.id);return}closeM()}function makeInv(s){let c=client(s.c),base=Number(s.price),num=S.set.pref+'-'+String(S.set.num).padStart(3,'0')+'/'+new Date().getFullYear(),i={id:id('i'),c:c.id,num,date:today(),concept:'Sesión profesional',base,total:base,st:'emitida'};S.set.num++;S.invoices.push(i);s.inv=i.id;return i}function mark(sid,st){let s=S.sessions.find(x=>x.id==sid);s.st=st;if(['asistida','finalizada'].includes(st)&&!s.inv){let inv=makeInv(s);save();created(inv.id);return}save();render()}function created(iid){let i=S.invoices.find(x=>x.id==iid),c=client(i.c);openM('<h2>Factura creada</h2><div class="success"><b>'+i.num+'</b><p>'+c.name+' · '+fmt(i.total)+'</p><p>Generada automáticamente desde la cita.</p></div><div class="grid"><button class="btn" onclick="seeInv(\''+i.id+'\')">Ver factura</button><button class="btn alt" onclick="sendInv(\''+i.id+'\')">Enviar WhatsApp</button><button class="btn alt" onclick="payForm(\''+i.id+'\')">Registrar cobro</button><button class="btn bad" onclick="dlg.close();render()">Cerrar</button></div>')}function seeInv(iid){let i=S.invoices.find(x=>x.id==iid),c=client(i.c);openM('<h2>'+i.num+'</h2><div class="item"><p><b>'+S.set.pro+'</b></p><p>Cliente: '+c.name+'</p><p>'+i.concept+'</p><div class="total">'+fmt(i.total)+'</div></div><button class="btn" onclick="print()">Imprimir/PDF</button>')}function sendInv(iid){let i=S.invoices.find(x=>x.id==iid),c=client(i.c),p=String(c.phone||'').replace(/\D/g,'');if(p.length==9)p='34'+p;if(!p)return alert('Falta teléfono');window.open('https://wa.me/'+p+'?text='+encodeURIComponent('Hola '+c.name+', te envío la factura '+i.num+' por importe de '+fmt(i.total)+'.'),'_blank');i.sent=true;save()}function payForm(iid){let i=S.invoices.find(x=>x.id==iid);openM('<h2>Registrar cobro</h2><div class="field"><label>Importe</label><input id="pa" type="number" value="'+bal(i)+'"></div><button class="btn" onclick="S.payments.push({id:id(\'p\'),inv:\''+iid+'\',amount:Number(pa.value),date:today()});closeM()">Guardar cobro</button>')}function seed(){if(S.clients.length)return;S.clients.push({id:id('c'),name:'Pep J',phone:'612345678',price:60});S.sessions.push({id:id('s'),c:S.clients[0].id,start:new Date(Date.now()+3600000).toISOString().slice(0,16),price:60,st:'programada',inv:''});save();render()}function openSheet(){$('sheet').classList.add('open')}function closeSheet(){$('sheet').classList.remove('open')}load();$('fab').onclick=openSheet;$('sheet').onclick=e=>{if(e.target.id=='sheet')closeSheet()};$('dlg').onclick=e=>{if(e.target.id=='dlg')$('dlg').close()};render();</script></body></html>
